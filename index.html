<!DOCTYPE html>
<html lang="en">
    <body>
        <button type="button" class="paper">paper </button>
        <button type="button" class="rock">rock </button>
        <button type="button" class="scissors">scissors </button>
        <div class="home"></div>
        <script>
            let random;
            let ropasi = "none";
            let player;
            let trueorfalse = false;
                
            let input = "none";
            let rock = document.body.querySelector("button.rock")
            let scissors = document.body.querySelector("button.scissors")
            let paper = document.body.querySelector("button.paper")
            let shell = document.body.querySelector(".home")
            console.log(rock + "," + paper + "," + scissors)
            
            
            console.log(input)
            function getcumputer(){
                if(random <= 0.4){
                    ropasi = "rock";
                }
            
                if( random >= 0.7){
                    ropasi = "scissors"
                } if(random < 0.7 && random > 0.4){
                    ropasi= "paper"
                }
            }
            let div = document.createElement("div");
            playgame()
            function playgame() {
            
        
                let cumputer = 0;
                let player = 0;
                    rock.addEventListener("click", () => {
                        input = "rock";
                        playround();
                        
                    });
                    paper.addEventListener("click", () => {
                        input = "paper";
                        playround();                
                    });
                    scissors.addEventListener("click", () => {
                        input = "scissors";
                        playround();
                    });
                    
                
                function playround(){
                
                

                    random = Math.random();
                
                    getcumputer();
                    if(input == ropasi){
                        player++;
                        cumputer++;
                    } if(ropasi == "rock" && input == "scissors"){
                        cumputer++;
                    } if(ropasi == "scissors" && input == "paper"){
                        cumputer++;
                    } if(ropasi == "paper" && input == "rock"){
                        cumputer++;
                    }
                    if(input == "rock" && ropasi == "scissors"){
                        player++;
                    } if(input == "scissors" && ropasi == "paper"){
                        player++;
                    } if(input == "paper" && ropasi == "rock"){
                        player++;
                    }
                    if(player + cumputer == 5){
                        if(cumputer==player){
                            div.textContent = "tie";
                        } if(player>cumputer){
                            div.textContent = "won";
                        } if(player<cumputer){
                            div.textContent = "lost"
                        }
                    }
                    shell.appendChild(div)
                
                }
                
                
            }
                
        </script>
    </body>
</html>
